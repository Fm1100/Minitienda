{% extends 'base.html' %}

{% block content %}
<h2>Gestión de Categorías</h2>

<!-- Formulario para crear categoría -->
<form action="/categorias" method="POST">
    <div>
        <label for="nombre">Nombre de la categoría:</label>
        <input type="text" id="nombre" name="nombre" required>
    </div>
    <button type="submit">Guardar Categoría</button>
</form>

<hr>

<h3>Lista de Categorías</h3>
<ul style="list-style-type: none; padding: 0;">
    {% for cat in categorias_html %}
    <li
        style="margin-bottom: 10px; padding: 8px; border: 1px solid #ddd; border-radius: 4px; display: flex; justify-content: space-between; align-items: center;">
        <!-- El nombre ahora es un enlace interactivo para ver sus productos -->
        <a href="/categoria/{{ cat.id }}/productos" style="font-weight: bold; text-decoration: none; color: #007bff;">
            {{ cat.nombre }}
        </a>

        <div>
            <a href="/categorias/editar/{{ cat.id }}"
                style="background-color: #ffc107; color: black; padding: 4px 8px; text-decoration: none; border-radius: 3px; margin-right: 5px;">Editar</a>

            <form action="/categorias/eliminar/{{ cat.id }}" method="POST"
                style="display: inline; margin: 0; padding: 0;">
                <button type="submit"
                    style="background-color: #dc3545; color: white; border: none; padding: 5px 8px; border-radius: 3px; cursor: pointer;"
                    onclick="return confirm('¿Estás seguro de eliminar esta categoría?');">Eliminar</button>
            </form>
        </div>
    </li>
    {% endfor %}
</ul>
{% endblock %}
