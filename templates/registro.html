{% extends 'base.html' %}

{% block content %}
<div
    style="max-width: 450px; margin: 40px auto; background: #f8f9fa; padding: 30px; border-radius: 8px; border: 1px solid #dee2e6; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
    <h2 style="margin-top: 0; text-align: center; color: #333;">Crear Cuenta de Cliente</h2>
    <p style="text-align: center; color: #6c757d; margin-bottom: 25px;">Regístrate para comenzar a comprar y armar tu
        carrito.</p>

    <form action="/registro" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
        <div>
            <label for="nombre" style="display: block; font-weight: 500; margin-bottom: 5px;">Nombre completo:</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Ej: Pepito Perez"
                style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <div>
            <label for="email" style="display: block; font-weight: 500; margin-bottom: 5px;">Correo electrónico:</label>
            <input type="email" id="email" name="email" required placeholder="Ej: correo@gmail.com"
                style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <div>
            <label for="password" style="display: block; font-weight: 500; margin-bottom: 5px;">Contraseña:</label>
            <input type="password" id="password" name="password" required placeholder="••••••••"
                style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;">
        </div>

        <button type="submit"
            style="background-color: #28a745; color: white; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px;">Registrarse</button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 14px; color: #6c757d;">
        ¿Ya tienes una cuenta? <a href="/login" style="color: #007bff; text-decoration: none; font-weight: 500;">Inicia
            sesión aquí</a>
    </div>
</div>
{% endblock %}
